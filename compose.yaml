services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge-local-only
    volumes:
      - forge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 8787
      DATABASE_URL: postgresql://forge:forge-local-only@postgres:5432/forge
      DATABASE_SSL: disable
      FORGE_WEB_ORIGIN: http://localhost:4173
      FORGE_DEV_TOKEN: forge-local-development-token-change-me
      FORGE_DEV_USER_ID: forge-development-user
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  forge-postgres:
