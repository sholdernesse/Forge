name: iOS preview

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'apps/web/**'
      - '.github/workflows/ios-preview.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle Forge preview for iOS
        run: pnpm --filter @forge/ios prepare:preview
      - name: Compile unsigned simulator app
        run: |
          xcodebuild -version
          xcodebuild -project apps/ios/ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/forge-ios-preview" CODE_SIGNING_ALLOWED=NO build
      - name: Verify bundled app and retain simulator artifact
        run: |
          app="$RUNNER_TEMP/forge-ios-preview/Build/Products/Debug-iphonesimulator/App.app"
          test -f "$app/public/index.html"
          test -d "$app/public/exercises"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = io.gnosislab.forge.preview
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/forge-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-ios-simulator
          path: ${{ runner.temp }}/forge-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
