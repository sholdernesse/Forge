name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate deployment security boundaries
        run: scripts/deployment/validate-security.sh
      - name: Validate recovery scripts
        run: bash -n scripts/postgres/backup.sh scripts/postgres/restore.sh
      - name: Compile Azure infrastructure
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/apps.bicep --stdout > /dev/null
      - name: Build API container
        run: docker build --file apps/api/Dockerfile --tag forge-api:ci .
      - name: Build web gateway container
        run: docker build --file apps/web/Dockerfile --tag forge-web:ci .
