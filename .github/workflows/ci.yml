name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forge_test
          POSTGRES_USER: forge_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge_test -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Exercise isolated PostgreSQL consent and release smoke
        env:
          DATABASE_URL: postgresql://forge_test:isolated-ci-only@127.0.0.1:5432/forge_test
          FORGE_DATABASE_TESTS: isolated
        run: node --test scripts/postgres/consent-integration.test.mjs scripts/release/candidate-smoke.test.mjs scripts/nutrition/meal-photo-accuracy.test.mjs scripts/local-environment.test.mjs
      - name: Validate deployment security boundaries
        run: scripts/deployment/validate-security.sh
      - name: Validate recovery and release scripts
        run: bash -n scripts/postgres/backup.sh scripts/postgres/restore.sh scripts/postgres/drill-preflight.sh scripts/release/validate-readiness.sh
      - name: Exercise release readiness policy
        shell: bash
        run: |
          evidence=(
            CANDIDATE_COMMIT=0123456789abcdef0123456789abcdef01234567
            DEPLOYMENT_URL=https://forge.example.test
            PHYSICAL_RESULT=PASS
            PHYSICAL_EVIDENCE_URL=https://evidence.example.test/physical
            POSTGRES_RESULT=PASS
            POSTGRES_EVIDENCE_URL=https://evidence.example.test/postgres
            RENDER_RESULT=PASS
            RENDER_EVIDENCE_URL=https://evidence.example.test/render
            IDENTITY_RESULT=PASS
            IDENTITY_EVIDENCE_URL=https://evidence.example.test/identity
            FAILOVER_RESULT=PASS
            FAILOVER_EVIDENCE_URL=https://evidence.example.test/failover
            GITHUB_STEP_SUMMARY="$RUNNER_TEMP/release-summary.md"
          )
          env "${evidence[@]}" bash scripts/release/validate-readiness.sh
          if env "${evidence[@]}" PHYSICAL_RESULT=BLOCKED bash scripts/release/validate-readiness.sh; then
            echo "Release validator accepted a blocked mandatory gate" >&2
            exit 1
          fi
      - name: Compile Azure infrastructure
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/apps.bicep --stdout > /dev/null
      - name: Build API container
        run: docker build --file apps/api/Dockerfile --tag forge-api:ci .
      - name: Build web gateway container
        run: docker build --file apps/web/Dockerfile --tag forge-web:ci .
